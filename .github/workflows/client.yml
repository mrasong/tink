name: Client

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Tink.app (arm64 / x86_64 / universal)
        run: ./scripts/build_app.sh

      - name: Package zips
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          for arch in arm64 x86_64 universal; do
            ditto -c -k --keepParent "build/${arch}/Tink.app" "Tink-${version}-${arch}.zip"
          done
          ls -lh Tink-*.zip

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Tink-macos-${{ github.event_name == 'push' && github.ref_name || 'dev' }}
          path: Tink-*.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "$tag" \
              --target "$GITHUB_SHA" \
              --notes "macOS client builds (arm64 / x86_64 / universal). Ad-hoc signed; run \`xattr -dr com.apple.quarantine Tink.app\` on first launch."
          fi
          gh release upload "$tag" Tink-*.zip --clobber
