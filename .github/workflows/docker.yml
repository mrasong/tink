name: Docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/mrasong/tink
  CACHE: ghcr.io/mrasong/tink-buildcache

jobs:
  frontend:
    name: Build web assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/web/pnpm-lock.yaml

      - name: Build
        working-directory: server/web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: server/internal/web/dist

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: server/internal/web/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build
        working-directory: server
        run: go build ./...

      - name: Test
        working-directory: server
        run: go test ./...

  docker:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: [frontend, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: server/internal/web/dist

      - name: Check tag matches VERSION
        if: github.event_name == 'push'
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::git tag $GITHUB_REF_NAME does not match VERSION file (v$version)"
            exit 1
          fi

      - name: Compute build args
        id: args
        run: |
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "build_id=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # only tag pushes fire `push`, so latest follows formal releases
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=ref,event=tag
            # sha tag only identifies trial builds from manual runs
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name != 'push' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.args.outputs.version }}
            BUILD_ID=${{ steps.args.outputs.build_id }}
          cache-from: type=registry,ref=${{ env.CACHE }}:latest
          cache-to: type=registry,ref=${{ env.CACHE }}:latest,mode=max,image-manifest=true,oci-mediatypes=true
